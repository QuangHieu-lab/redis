name: Node.js CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  nodejs-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy code từ repository
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cài đặt thư viện
        run: npm ci

      - name: Chạy Test (Nếu có)
        run: npm run test --if-present

      - name: Kiểm tra Build Docker Compose
        run: docker compose build
